; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Wi-Fi credentials are NOT stored here. Copy include/secrets.h.example to
; include/secrets.h and fill in your credentials before building.
; secrets.h is .gitignored and must never be committed.

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
lib_deps =
    ; ArduinoJson for proper JSON parsing
    bblanchon/ArduinoJson@^7.3.1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wno-error=format
    -Wno-error=deprecated-declarations
    ; Enable SD card support as a diagnostic feature (disabled by default)
    ; Uncomment to build with SD support:
    ; -DENABLE_SD_CARD=1
board_upload.maximum_ram_size = 327680
board_upload.maximum_size = 2097152
; Embed web assets as binary sections accessible via asm() symbols
board_build.embed_txtfiles =
    src/web/index.html
    src/web/styles.css
    src/web/app.js

